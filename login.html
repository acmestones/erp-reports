<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — ACM Reports</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body{font-family:Inter, sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background:#f7f8fb}
    .box{background:#fff;padding:32px;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,.08);text-align:center;width:320px}
    p{color:#666}
  </style>
</head>
<body>
  <div class="box">
    <h3>🔒 ACM Reports Login</h3>
    <p>Sign in with Google to continue</p>
    <div id="buttonDiv" style="margin:16px 0;"></div>
    <div id="status"></div>
  </div>

  <script>
    const CLIENT_ID = "979512358609-8pqtstsbg5esv6fv8hrl48r2a7m4vbpt.apps.googleusercontent.com";
    const REDIRECT_PAGE = "index.html";

    function parseJwt(token){
      const base64Url=token.split('.')[1];
      const base64=base64Url.replace(/-/g,'+').replace(/_/g,'/');
      return JSON.parse(decodeURIComponent(atob(base64).split('').map(c=>
        '%'+('00'+c.charCodeAt(0).toString(16)).slice(-2)).join('')));
    }

    function handleCredentialResponse(resp){
      try{
        const data=parseJwt(resp.credential);
        localStorage.setItem('userEmail',data.email);
        window.location.replace(REDIRECT_PAGE);
      }catch(e){
        document.getElementById('status').innerHTML='<p style="color:red">Login failed</p>';
      }
    }

    window.onload=()=>{
      google.accounts.id.initialize({client_id:CLIENT_ID,callback:handleCredentialResponse});
      google.accounts.id.renderButton(document.getElementById("buttonDiv"),{theme:"outline",size:"large"});
    };
  </script>
</body>
</html>
