<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Panel — Acme Stonemart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script>
    const ADMIN_USERS = ["marblehouse@gmail.com"];
    const currentUser = localStorage.getItem("user");
    if (!currentUser || !ADMIN_USERS.includes(currentUser)) {
      alert("Access denied. Admin only.");
      window.location.replace("index.html");
    }
  </script>
</head>
<body class="bg-light">
<div class="container py-4">
  <h2>🔧 Admin Panel</h2>
  <p class="text-muted">Manage users, permissions, and field visibility</p>
  
  <ul class="nav nav-tabs" role="tablist">
    <li class="nav-item"><a class="nav-link active" data-bs-toggle="tab" href="#users">Users</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#fields">Field Management</a></li>
    <li class="nav-item"><a class="nav-link" data-bs-toggle="tab" href="#permissions">Permissions</a></li>
  </ul>

  <div class="tab-content mt-3">
    <div id="users" class="tab-pane fade show active">
      <h4>User Management</h4>
      <button class="btn btn-primary mb-3" onclick="addUser()">+ Add User</button>
      <table class="table table-bordered">
        <thead>
          <tr><th>Email</th><th>Role</th><th>Actions</th></tr>
        </thead>
        <tbody id="userTable"></tbody>
      </table>
    </div>

    <div id="fields" class="tab-pane fade">
      <h4>Field Visibility & Order</h4>
      <p class="text-muted">Drag to reorder, toggle visibility</p>
      <div id="fieldList"></div>
    </div>

    <div id="permissions" class="tab-pane fade">
      <h4>Field Permissions by User</h4>
      <p class="text-muted">Define which users can view/edit which fields</p>
      <div id="permissionsGrid"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="admin.js"></script>
</body>
</html>
